<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#041226" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- 8-Point Rub el Hizb Star Frame -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <rect x="-140" y="-140" width="280" height="280" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.75" />
    <rect x="-140" y="-140" width="280" height="280" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.75" transform="rotate(45)" />
    
    <!-- Central Shield / Dome -->
    <circle r="115" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5" />

    <!-- Islamic Dome & Minaret Silhouette -->
    <path d="M 0 -85 C 35 -65 55 -25 55 45 L -55 45 C -55 -25 -35 -65 0 -85 Z" fill="url(#emeraldGrad)" />
    <circle cx="0" cy="-92" r="7" fill="url(#goldGrad)" />

    <!-- Champion Star / Trophy Accent -->
    <path d="M 0 -15 L 7 5 L 28 5 L 11 17 L 18 38 L 0 25 L -18 38 L -11 17 L -28 5 L -7 5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Title Monogram COC -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="4">CLASH CHAMP</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="16" fill="#f59e0b" text-anchor="middle" letter-spacing="2">ISLAMIC ODYSSEY</text>
</svg>
